name: wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.platform.os }} ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: linux, runner: ubuntu-latest, target: x86_64 }
          - { os: linux, runner: ubuntu-24.04-arm, target: aarch64 }
          - { os: macos, runner: macos-latest, target: aarch64 }
          - { os: windows, runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      # The extension is built against Python's stable ABI (abi3-py39), so a
      # single wheel per platform covers every Python from 3.9 up. That is why
      # there is no Python version in this matrix -- the versions are exercised
      # in test-wheel below, which is where a version matrix actually tells you
      # something. Building one wheel per version would produce artifacts that
      # differ only in their filename.
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: "true"
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  test-wheel:
    name: python ${{ matrix.python }} on ${{ matrix.os }}
    needs: [build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            artifact: wheel-linux-x86_64
          - os: macos-latest
            artifact: wheel-macos-aarch64
          - os: windows-latest
            artifact: wheel-windows-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # This is the abi3 claim under test. One wheel, built by whichever Python
      # the runner happened to have, must install and pass the suite on all six
      # interpreters. If abi3 were ever broken or dropped, every row but one
      # would fail here rather than in someone's environment after release.
      - name: Install the built wheel
        shell: bash
        run: pip install pytest numpy dist/*.whl
      - name: Import and mesh something
        shell: bash
        run: |
          python -c "
          import numpy as np, serra_mesh
          a = np.zeros((8, 8, 8), np.uint32); a[2:6, 2:6, 2:6] = 1
          m = serra_mesh.Mesher().mesh(a, close=True).get(1)
          assert m.is_closed()
          print('ok', serra_mesh.__version__, len(m.faces), 'faces')
          "
      # Against the installed wheel, not an editable build, so packaging
      # mistakes -- a missing python-source file, a bad module-name -- show up.
      - name: Run the test suite
        shell: bash
        run: pytest tests -q

  publish:
    name: publish to PyPI
    needs: [build, sdist, test-wheel]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI verifies this workflow's OIDC identity, so there
    # is no API token to store or leak. Configure the publisher on PyPI for
    # AllenInstitute/serra, workflow wheels.yml, environment pypi. For the very
    # first upload the project does not exist yet, so it has to be added as a
    # *pending* publisher instead.
    environment:
      name: pypi
      url: https://pypi.org/p/serra-mesh
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # release.yml can also publish. Tags pushed by GITHUB_TOKEN do not
          # trigger workflows, so the two should never both fire for one
          # version -- but if they ever did, the second should decline rather
          # than fail the release.
          skip-existing: true
