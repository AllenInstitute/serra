[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "serra"
version = "0.0.1"
description = "Analytical multi-material meshes from voxelized segmentations"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Forrest Collman", email = "forrest.collman@gmail.com" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy>=1.21"]

[project.urls]
Homepage = "https://github.com/fcollman/serra"

[tool.maturin]
python-source = "python"
module-name = "serra._serra"

[dependency-groups]
dev = ["pytest", "pytest-cov", "ipykernel", "bump-my-version", "maturin"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]
lint = ["ruff"]
# Used by the benchmark and figure scripts. zmesh itself is imported from a
# local checkout (see bench/render_comparison.py) so the comparison runs
# against the exact build you have, not whatever is on PyPI.
bench = ["pyvista", "scipy"]

[tool.uv]
default-groups = ["dev", "docs", "lint"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Documentation prose is formatted by hand; ruff also reflows Python code
# blocks inside Markdown, which mangles aligned comments in examples.
extend-exclude = ["*.ipynb", "*.md"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.bumpversion]
current_version = "0.0.1"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
regex = false
ignore_missing_version = false
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = true
message = "v{new_version}"
commit_args = ""

# The Rust crate version must move in lockstep with the Python one.
[[tool.bumpversion.files]]
filename = "Cargo.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[tool.poe.tasks.build]
cmd = "maturin develop --release"
help = "Compile the Rust extension into the active environment."

[tool.poe.tasks.test]
cmd = "pytest tests"
help = "Run the Python test suite."

[tool.poe.tasks.test-rust]
cmd = "cargo test --no-default-features"
help = "Run the Rust unit tests."

[tool.poe.tasks.lint]
sequence = [
    { cmd = "ruff check ." },
    { cmd = "ruff format --check ." },
    { cmd = "cargo fmt --check" },
    { cmd = "cargo clippy --all-targets -- -D warnings" },
]
help = "Lint and format-check both languages."

[tool.poe.tasks.drybump]
cmd = "bump-my-version bump --dry-run --verbose"
help = "Dry run of a version bump. Use with 'patch', 'minor', or 'major'."

[tool.poe.tasks.bump]
cmd = "bump-my-version bump"
help = "Bump the version. Use with 'patch', 'minor', or 'major'."
